[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kefu"
version = "0.1.0"
description = "AI电商客服系统 - 多智能体架构"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "gradio>=4.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
kefu = "kefu.app:main"

[tool.setuptools.packages.find]
include = ["kefu*"]
